<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Construye — Asistencia Técnica para el Hogar</title>
    <script>
        /* Prevent flash of wrong theme */
        (function() {
            var t = localStorage.getItem('construye-theme');
            document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        })();
    </script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ── DARK THEME (default) ─────────────────────────── */
        :root {
            --radius: 14px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 24px rgba(0,0,0,0.4);

            /* Surfaces */
            --bg-base:        #08090d;
            --bg-elevated:    #0f1015;
            --bg-card:        rgba(255,255,255,0.04);
            --bg-card-hover:  rgba(255,255,255,0.07);
            --bg-input:       rgba(255,255,255,0.06);

            /* Borders */
            --border:         rgba(255,255,255,0.08);
            --border-subtle:  rgba(255,255,255,0.05);
            --border-strong:  rgba(255,255,255,0.15);

            /* Text — WCAG AA verified on dark bg */
            --text:           rgba(255,255,255,0.92);  /* ~16.8:1 */
            --text-muted:     rgba(255,255,255,0.55);  /* ~9.9:1  */
            --text-faint:     rgba(255,255,255,0.35);  /* decorative only */
            --text-on-accent: #ffffff;

            /* Accent — #c45500 = white-on-btn 4.64:1 ✓ WCAG AA */
            --accent:         #e67e22;   /* on dark bg: ~6.9:1 ✓ */
            --accent-btn:     #c45500;   /* white text: 4.64:1 ✓ */
            --accent-hover:   #a33f00;
            --accent-subtle:  rgba(230,126,34,0.12);
            --accent-border:  rgba(230,126,34,0.28);
            --accent-glow:    rgba(230,126,34,0.15);
            --accent-text:    #f0a45d;

            /* Nav */
            --nav-bg:         rgba(8,9,13,0.88);
            --nav-border:     rgba(255,255,255,0.06);

            /* Specialty headers */
            --sp-plumbing-bg:     linear-gradient(135deg,#0d2d4a,#1a5c8a);
            --sp-plumbing-border: rgba(59,150,212,0.3);
            --sp-masonry-bg:      linear-gradient(135deg,#1c1f24,#2c3540);
            --sp-masonry-border:  rgba(154,163,175,0.2);
            --sp-electrical-bg:   linear-gradient(135deg,#2a1d00,#5a3e00);
            --sp-electrical-border: rgba(245,166,35,0.3);
            --sp-text:            #ffffff;

            /* Hero */
            --hero-title-start:   #ffffff;
            --grid-line:          rgba(255,255,255,0.03);
            --badge-bg:           rgba(230,126,34,0.12);
            --badge-border:       rgba(230,126,34,0.25);
            --badge-text:         #f0a45d;
            --stat-num:           #ffffff;
            --stat-label:         rgba(255,255,255,0.4);
            --stat-div:           rgba(255,255,255,0.12);

            /* Legacy aliases for inner app */
            --bg:             var(--bg-base);
            --card-bg:        var(--bg-card);
            --border-color:   var(--border);
            --plumbing:       #3b96d4;
            --masonry:        #9aa3af;
            --electrical:     #f5a623;
        }

        /* ── LIGHT THEME ──────────────────────────────────── */
        [data-theme="light"] {
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.07);
            --shadow-md: 0 4px 24px rgba(0,0,0,0.10);

            --bg-base:        #f4f5f7;
            --bg-elevated:    #ffffff;
            --bg-card:        #ffffff;
            --bg-card-hover:  #f8f9fc;
            --bg-input:       #ffffff;

            --border:         #d1d5db;
            --border-subtle:  #e8eaed;
            --border-strong:  #b0b5be;

            /* Text — WCAG AA on #f4f5f7 and #ffffff */
            --text:           #111318;   /* ~19:1 on white ✓ */
            --text-muted:     #5a6272;   /* ~5.3:1 on white ✓ */
            --text-faint:     #6b7280;   /* ~4.5:1 on white ✓ */
            --text-on-accent: #ffffff;

            /* Accent — #a84500: on white 5.4:1 ✓; white on it 5.8:1 ✓ */
            --accent:         #a84500;
            --accent-btn:     #a84500;
            --accent-hover:   #8b3a00;
            --accent-subtle:  rgba(168,69,0,0.08);
            --accent-border:  rgba(168,69,0,0.22);
            --accent-glow:    rgba(168,69,0,0.08);
            --accent-text:    #a84500;

            --nav-bg:         rgba(244,245,247,0.92);
            --nav-border:     rgba(0,0,0,0.08);

            --sp-plumbing-bg:     linear-gradient(135deg,#dbeafe,#bfdbfe);
            --sp-plumbing-border: rgba(59,130,246,0.3);
            --sp-masonry-bg:      linear-gradient(135deg,#f3f4f6,#e5e7eb);
            --sp-masonry-border:  rgba(90,98,114,0.25);
            --sp-electrical-bg:   linear-gradient(135deg,#fef3c7,#fde68a);
            --sp-electrical-border: rgba(168,69,0,0.25);
            --sp-text:            #1c1c1e;

            --hero-title-start:   #111318;
            --grid-line:          rgba(0,0,0,0.04);
            --badge-bg:           rgba(168,69,0,0.08);
            --badge-border:       rgba(168,69,0,0.22);
            --badge-text:         #a84500;
            --stat-num:           #111318;
            --stat-label:         #5a6272;
            --stat-div:           #d1d5db;

            --bg:             var(--bg-base);
            --card-bg:        var(--bg-card);
            --border-color:   var(--border);
            --plumbing:       #1a5c8a;
            --masonry:        #5a6272;
            --electrical:     #a84500;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        #app {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
